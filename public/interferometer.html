<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Квантовый Интерферометр: Оптический Поиск</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: monospace; }
        canvas { width: 100vw; height: 100vh; display: block; }
        #ui { position: absolute; top: 15px; left: 15px; color: #0ff; z-index: 10; text-shadow: 0 0 8px #0ff; pointer-events: none;}
        .hud-line { margin: 5px 0; font-size: 14px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="hud-line">[ КВАНТОВЫЙ ИНТЕРФЕРОМЕТР: ФАЗА АКТИВНА ]</div>
        <div class="hud-line">ПАТТЕРН: Амплитудное Усиление (Гровер)</div>
        <div class="hud-line" id="fps">Когерентность: Рассчет...</div>
    </div>
    <canvas id="screen"></canvas>

<script>
const shaderCode = `
    struct Uniforms {
        time: f32,
        resolution: vec2<f32>,
    };
    @group(0) @binding(0) var<uniform> uniforms: Uniforms;

    struct VertexOutput {
        @builtin(position) Position: vec4<f32>,
        @location(0) uv: vec2<f32>,
    }

    @vertex
    fn vs_main(@builtin(vertex_index) id: u32) -> VertexOutput {
        let uv = vec2<f32>(f32((id << 1u) & 2u), f32(id & 2u));
        var out: VertexOutput;
        out.Position = vec4<f32>(uv * 2.0 - 1.0, 0.0, 1.0);
        out.uv = uv;
        return out;
    }

    // Хэш-функция, имитирующая криптографический ландшафт
    fn hash21(p: vec2<f32>) -> f32 {
        var p3  = fract(vec3<f32>(p.xyx) * 0.1031);
        p3 = p3 + dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
    }

    @fragment
    fn fs_main(in: VertexOutput) -> @location(0) vec4<f32> {
        var uv = in.uv * 2.0 - 1.0;
        uv.x = uv.x * (uniforms.resolution.x / uniforms.resolution.y);
        
        let t = uniforms.time * 2.0;

        // 1. КООРДИНАТА ЦЕЛИ (Наш зашифрованный ответ)
        // В реальности мы не знаем, где он, но криптография создает градиент
        let target = vec2<f32>(sin(t * 0.2) * 0.8, cos(t * 0.3) * 0.5);

        // 2. ИНДЕКС ПРЕЛОМЛЕНИЯ (Refractive Index)
        // "Слепой" алгоритм чувствует плотность. Чем ближе к цели, тем выше плотность.
        let dist = length(uv - target);
        // Линза Гровера: гравитационный колодец вероятности
        let lens_density = 1.0 + (0.1 / (dist * dist + 0.01)); 

        // 3. ФАЗОВАЯ СИМУЛЯЦИЯ (Дисперсия фотона)
        // Излучаем когерентную волну. Она замедляется там, где плотность выше.
        let phase_x = (uv.x * 15.0 * lens_density) - t * 5.0;
        let phase_y = (uv.y * 15.0 * lens_density);
        
        // Суперпозиция волн (интерференция)
        let wave1 = sin(phase_x) * cos(phase_y);
        let wave2 = sin(length(uv) * 20.0 - t * 4.0);
        
        // 4. КОЛЛАПС (Фокусировка энергии)
        // Волны складываются. Вне линзы они гасят друг друга. 
        // Внутри линзы - резонируют и взрываются яркостью.
        let amplitude = (wave1 + wave2) * 0.5;
        let energy = amplitude * amplitude * lens_density * 0.1;

        // 5. ВИЗУАЛИЗАЦИЯ
        // Фон: темный океан вероятностей (хаос)
        var color = vec3<f32>(hash21(uv + t) * 0.05); 
        
        // Радиальная дисперсия (хвосты волны)
        color = color + vec3<f32>(0.0, energy * 0.3, energy * 0.8);
        
        // Точка абсолютного резонанса (Сингулярность ответа)
        let singularity = smoothstep(0.05, 0.0, dist);
        color = color + vec3<f32>(singularity * 2.0, singularity * 3.0, singularity * 5.0);

        return vec4<f32>(color, 1.0);
    }
\`;

async function initRender() {
    if (!navigator.gpu) { alert("WebGPU не поддерживается."); return; }

    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('webgpu');
    canvas.width = window.innerWidth * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;

    const adapter = await navigator.gpu.requestAdapter();
    const device = await adapter.requestDevice();
    const format = navigator.gpu.getPreferredCanvasFormat();

    ctx.configure({ device, format, alphaMode: 'premultiplied' });

    const shaderModule = device.createShaderModule({ code: shaderCode });
    const pipeline = device.createRenderPipeline({
        layout: 'auto',
        vertex: { module: shaderModule, entryPoint: 'vs_main' },
        fragment: { module: shaderModule, entryPoint: 'fs_main', targets: [{ format }] },
        primitive: { topology: 'triangle-list' }
    });

    const uniformBuffer = device.createBuffer({
        size: 8, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });

    const bindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [{ binding: 0, resource: { buffer: uniformBuffer } }]
    });

    const uniformArray = new Float32Array(2);
    let lastTime = performance.now();
    let frames = 0;

    function frame(time) {
        frames++;
        if (time - lastTime >= 1000) {
            document.getElementById('fps').innerText = \`Когерентность: \${frames} FPS | Среда: Оптическая\`;
            frames = 0; lastTime = time;
        }

        uniformArray[0] = time * 0.001;
        uniformArray[1] = canvas.width / canvas.height;
        device.queue.writeBuffer(uniformBuffer, 0, uniformArray);

        const commandEncoder = device.createCommandEncoder();
        const renderPass = commandEncoder.beginRenderPass({
            colorAttachments: [{ view: ctx.getCurrentTexture().createView(), clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: 'clear', storeOp: 'store' }]
        });

        renderPass.setPipeline(pipeline);
        renderPass.setBindGroup(0, bindGroup);
        renderPass.draw(3);
        renderPass.end();

        device.queue.submit([commandEncoder.finish()]);
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
}
initRender();
</script>
</body>
</html>
